<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>איפוס סיסמה · סופר ומונה</title>
  <link rel="stylesheet" href="/account.css?v=8">
</head>
<body>
  <main class="landing">
    <div class="landing-heading">
      <span class="brand-mark" aria-hidden="true">סמ</span>
      <span>סופר ומונה</span>
      <select data-account-language aria-label="שפת הממשק">
        <option value="he">עברית</option>
        <option value="yi">ייִדיש</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="landing-content password-reset-content">
      <section class="sign-in-card" aria-labelledby="sign-in-title">
        <h2 id="sign-in-title">איפוס סיסמה</h2>
        <p id="sign-in-status">הזינו את כתובת המייל של החשבון לקבלת קישור לאיפוס הסיסמה.</p>
        <div id="email-auth">
          <form id="email-reset-form" class="auth-form" method="post">
            <label for="reset-email">כתובת המייל של החשבון</label>
            <input id="reset-email" name="email" type="email" autocomplete="username" dir="ltr" required disabled>
            <button type="submit" disabled>שליחת קישור לאיפוס סיסמה</button>
          </form>
          <p id="email-feedback" role="status">טוען את שירות איפוס הסיסמה…</p>
          <noscript><p>כדי לשלוח בקשת איפוס צריך לאפשר JavaScript בדפדפן.</p></noscript>
          <div id="email-actions"><a class="auth-link auth-secondary" href="/">חזרה לכניסה</a></div>
        </div>
      </section>
    </div>
    <footer class="landing-footer">סופר ומונה <span aria-hidden="true">·</span> גרסת ניסיון</footer>
  </main>
  <script type="module" src="/password-reset.js?v=8"></script>
</body>
</html>
